<div class="sidebar-wrapper">
        <aside class="sidebar" [class.collapsed]="collapsed">
                <button class="sidebar-toggle" type="button" (click)="toggleCollapsed()"
                        [attr.aria-label]="collapsed ? 'Mostrar menú' : 'Ocultar menú'">
                        <i class="bx" [class.bx-menu]="collapsed" [class.bx-menu-alt-left]="!collapsed"></i>
                </button>

                @for (section of visibleSections(); track section.title) {
                <p class="menu-title">{{ section.title }}</p>
                @for (item of section.items; track item.route) {
                <a [routerLink]="item.route" routerLinkActive="active">
                        <i class="bx {{ item.icon }}"></i>
                        <span>{{ item.label }}</span>
                </a>
                }
                }
        </aside>
</div>
